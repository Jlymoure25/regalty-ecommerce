[build]
  # Build command for Vite React app
  command = "npm run build"
  
  # Directory that will be deployed
  publish = "dist"
  
  # Set Node.js version
  [build.environment]
    NODE_VERSION = "20"

# SPA redirect rules - ensures React Router works properly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
